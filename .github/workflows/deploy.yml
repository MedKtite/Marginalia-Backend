name: Build & deploy backend

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/medktite/readsake-backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/ci
      DB_USER: ci
      DB_PASSWORD: ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  build:
    needs: test
    # Only the prod branch ships; main and PRs run tests only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose file
        run: scp deploy/docker-compose.prod.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/readsake/docker-compose.yml"
      - name: Pull & restart
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/readsake && BACKEND_TAG=${{ github.sha }} docker compose pull backend \
             && BACKEND_TAG=${{ github.sha }} docker compose up -d --remove-orphans \
             && docker image prune -f"
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                 "docker exec readsake-backend-1 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'" 2>/dev/null; then
              echo "Backend is up"; exit 0
            fi
            sleep 5
          done
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "docker logs --tail 100 readsake-backend-1"
          exit 1
