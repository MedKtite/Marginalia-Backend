# Readsake — local Postgres + MinIO (S3-compatible)
#
# Pure local-dev config. All values are baked into this file — no .env
# indirection. Edit here if you want to change a port or credential.
#
# Run all `docker compose ...` commands from this directory
# (readsake-backend/dev/), not the repo root.
#
# Quick start:
#   docker compose up -d                    # start Postgres + MinIO
#
#   # Apply schema — pick the form for your shell:
#   #   PowerShell:
#   Get-Content ../../readsake-db/schema.sql | docker compose exec -T postgres psql -U readsake -d readsake
#   #   bash / Git Bash / cmd:
#   docker compose exec -T postgres psql -U readsake -d readsake < ../../readsake-db/schema.sql
#
#   docker compose down                     # stop (keeps data)
#   docker compose down -v                  # stop AND wipe data
#
# Reachable on:
#   localhost:5440   Postgres   user: readsake / pwd: Ktite@2030% / db: readsake
#   localhost:9000   MinIO S3 API
#   localhost:9001   MinIO console     login: minioadmin / minioadmin

services:
  postgres:
    image: postgres:15-alpine
    container_name: readsake-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: readsake
      POSTGRES_PASSWORD: Ktite@2030%
      POSTGRES_DB: readsake
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C.UTF-8"
    ports:
      - "5440:5432"
    volumes:
      - readsake_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readsake -d readsake"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible store. MinIO images are no longer published, so this runs
  # RustFS (MinIO-compatible API). Service name kept as "minio" so existing
  # S3_ENDPOINT=http://minio:9000 references keep working.
  minio:
    image: rustfs/rustfs:latest
    container_name: readsake-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - readsake_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ../../readsake-ingestion
      dockerfile: Dockerfile
    container_name: readsake-ingestion
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &ingestion-env
      DATABASE_URL: postgresql://readsake:Ktite%402030%25@postgres:5432/readsake
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: readsake-uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: INFO

  # Refreshes the Home "Trending" and "Top authors" snapshot every night.
  discovery-sync:
    build:
      context: ../../readsake-ingestion
      dockerfile: Dockerfile
    container_name: readsake-discovery-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *ingestion-env
    command: ["python", "-m", "ingestion.sync_gutenberg_trending", "--daily-at", "02:15"]

volumes:
  readsake_db:
  readsake_minio:

