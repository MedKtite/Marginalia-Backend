spring.config.import=optional:file:.env[.properties]
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=

google.client-id=


google.books.api-key=${GOOGLE_BOOKS_API_KEY}
revenuecat.webhook-secret=

# Password recovery via Gmail SMTP. Use a Google App Password for
# SMTP_PASSWORD; never commit the account's regular password.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:ktite.m3@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:ktite.m3@gmail.com}
app.password-reset-url=${PASSWORD_RESET_URL:marginalia://app/reset-password}
app.email-verification-url=${EMAIL_VERIFICATION_URL:http://localhost:8080/auth/verify-email}



firebase.service-account-path=


s3.endpoint=${S3_ENDPOINT}
s3.internal-endpoint=${S3_INTERNAL_ENDPOINT:${S3_ENDPOINT}}
s3.region=${S3_REGION}
s3.bucket=${S3_BUCKET}
s3.access-key-id=${S3_ACCESS_KEY_ID}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY}
s3.force-path-style=${S3_FORCE_PATH_STYLE}
s3.presign-expires-min=${S3_PRESIGN_EXPIRES_MIN}
s3.max-upload-bytes=${S3_MAX_UPLOAD_BYTES}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info

logging.level.org.springframework.web=INFO
logging.level.com.marginalia.dev=DEBUG
