spring.config.import=optional:file:.env[.properties]
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=

google.client-id=


google.books.api-key=${GOOGLE_BOOKS_API_KEY}
revenuecat.webhook-secret=

# Account emails via the Brevo API (templates: email-template/, see upload_to_brevo.py).
# Without BREVO_API_KEY the emails are only logged, with their links.
brevo.api-key=${BREVO_API_KEY:}
app.open-url=${APP_OPEN_URL:https://readsake.io}
app.password-reset-url=${PASSWORD_RESET_URL:readsake://app/reset-password}
app.email-verification-url=${EMAIL_VERIFICATION_URL:http://localhost:8080/auth/verify-email}



firebase.service-account-path=


s3.endpoint=${S3_ENDPOINT}
s3.internal-endpoint=${S3_INTERNAL_ENDPOINT:${S3_ENDPOINT}}
s3.region=${S3_REGION}
s3.bucket=${S3_BUCKET}
s3.access-key-id=${S3_ACCESS_KEY_ID}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY}
s3.force-path-style=${S3_FORCE_PATH_STYLE}
s3.presign-expires-min=${S3_PRESIGN_EXPIRES_MIN}
s3.max-upload-bytes=${S3_MAX_UPLOAD_BYTES}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info

logging.level.org.springframework.web=INFO
logging.level.com.readsake.dev=DEBUG
