# Marginalia backend — dev profile
# Everything is hardcoded for local development. No .env needed.
# When you're ready to deploy, create application-prod.properties with the
# same keys and source values from your secrets manager / env vars there.

server.port=8080

# ─── Database ───
# Matches the credentials baked into docker-compose.yml.
spring.datasource.url=jdbc:postgresql://localhost:5440/marginalia
spring.datasource.username=marginalia
spring.datasource.password=Ktite@2030%
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JWT ───
# Blank → JwtServiceImpl generates a secret on first boot and writes it to
# .jwt-secret (gitignored). Restarts reuse the same secret so tokens stay valid.
jwt.secret=

# ─── Google OAuth ───
# Blank → token aud check is skipped. Set to your real Web Client ID before
# shipping (xxx.apps.googleusercontent.com).
google.client-id=

# ─── RevenueCat webhook ───
# Blank → the webhook accepts any caller (so you can curl-test).
# Set this to the Authorization header value configured on the RevenueCat dashboard.
revenuecat.webhook-secret=

# ─── Firebase (FCM) ───
# Blank → FcmNotificationSender runs in DRY-RUN mode (logs would-be pushes).
# In prod, set to the absolute path of your service-account JSON.
firebase.service-account-path=

# ─── S3 / MinIO ───
# Defaults point at the MinIO container in docker-compose. For real AWS S3,
# clear s3.endpoint and flip s3.force-path-style to false.
s3.endpoint=http://localhost:9000
s3.region=us-east-1
s3.bucket=marginalia-uploads
s3.access-key-id=minioadmin
s3.secret-access-key=minioadmin
s3.force-path-style=true
s3.presign-expires-min=15
s3.max-upload-bytes=1073741824

# Spring multipart limits (presigned uploads bypass this; only used if we add
# a proxy-upload fallback later).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Actuator ───
management.endpoints.web.exposure.include=health,info

# ─── Logging ───
logging.level.org.springframework.web=INFO
logging.level.com.marginalia.dev=DEBUG
