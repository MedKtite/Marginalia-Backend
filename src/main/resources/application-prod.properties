# Production (api.readsake.io). Every value comes from the container
# environment — see deploy/.env.example. No .env file import here.
server.port=8080
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
google.client-id=${GOOGLE_CLIENT_ID:}
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}
revenuecat.webhook-secret=${REVENUECAT_WEBHOOK_SECRET:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Account emails via the Brevo API (templates: email-template/, see upload_to_brevo.py)
brevo.api-key=${BREVO_API_KEY:}
app.open-url=${APP_OPEN_URL:https://readsake.io}
app.password-reset-url=${PASSWORD_RESET_URL:readsake://app/reset-password}
app.email-verification-url=${EMAIL_VERIFICATION_URL:https://api.readsake.io/auth/verify-email}

s3.endpoint=${S3_ENDPOINT}
s3.internal-endpoint=${S3_INTERNAL_ENDPOINT:${S3_ENDPOINT}}
s3.region=${S3_REGION:us-east-1}
s3.bucket=${S3_BUCKET}
s3.access-key-id=${S3_ACCESS_KEY_ID}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY}
s3.force-path-style=${S3_FORCE_PATH_STYLE:true}
s3.presign-expires-min=${S3_PRESIGN_EXPIRES_MIN:15}
s3.max-upload-bytes=${S3_MAX_UPLOAD_BYTES:1073741824}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info

logging.level.org.springframework.web=INFO
logging.level.com.readsake.dev=INFO
